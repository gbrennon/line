version: '3.8'

services:
  line:
    build: .
    container_name: line-sequencer
    stdin_open: true
    tty: true
    network_mode: host
    privileged: true
    volumes:
      - /dev/snd:/dev/snd
      - /dev/midi:/dev/midi:rw
      - ./saved_phrases:/app/saved_phrases
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    environment:
      - DISPLAY=${DISPLAY}
      - PULSE_RUNTIME_PATH=/run/user/1000/pulse
      - PULSE_NATIVE_PATH=/run/user/1000/pulse/native
    devices:
      - /dev/snd
    group_add:
      - audio
    command: [ "./build/line" ]

  line-with-jack:
    build: .
    container_name: line-sequencer-jack
    stdin_open: true
    tty: true
    network_mode: host
    privileged: true
    volumes:
      - /dev/snd:/dev/snd
      - /dev/midi:/dev/midi:rw
      - ./saved_phrases:/app/saved_phrases
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /run/user/1000/pulse:/run/user/1000/pulse
    environment:
      - DISPLAY=${DISPLAY}
      - PULSE_RUNTIME_PATH=/run/user/1000/pulse
      - PULSE_NATIVE_PATH=/run/user/1000/pulse/native
    devices:
      - /dev/snd
    group_add:
      - audio
    command: [ "./build/line" ]
    profiles:
      - jack
